<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OATutor (Vue)</title>
  <script>
    window.MathJax = {
      tex: { inlineMath: [['$$', '$$']], displayMath: [['\\[', '\\]']] },
      chtml: { fontURL: '/mathjax/output/chtml/fonts/woff-v2' },
      startup: {
        pageReady: () => Promise.resolve(), // typeset on demand per-node
        ready: () => window.MathJax.startup.defaultReady(),
      },
    }
  </script>
  <script src="/mathjax/tex-chtml.js"></script>
</head>

<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
